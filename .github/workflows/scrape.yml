name: Scrape agences immobilières

on:
  workflow_dispatch:
    inputs:
      max_scrolls:
        description: "Nombre de défilements (plus = plus de résultats)"
        required: false
        default: "40"
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        run: |
          python scraper/scrape_agences_vaud.py \
            --headless \
            --max-scrolls ${{ github.event.inputs.max_scrolls }} \
            --output agences_immobilieres_vaud.csv

      - name: Upload CSV result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agences-immobilieres-vaud
          path: agences_immobilieres_vaud.csv
          retention-days: 30
